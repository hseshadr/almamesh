<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Observatory is a dark theme: render native form controls (date/select/
         text inputs), scrollbars and system colors with dark UA defaults so the
         light parchment text stays legible. Mirrored by `color-scheme: dark` on
         :root in index.css (and reset to `light` for the @media print report). -->
    <meta name="color-scheme" content="dark" />
    <!-- Spec 064: per-route SEO tags (title text, meta description, canonical,
         og:*, twitter:*) are injected AT BUILD TIME per prerendered route by
         vite-prerender-plugin from src/seo/routeHead.ts — the plugin REPLACES
         this fallback title's text and APPENDS the rest, so keep this template
         free of route-specific description/canonical/og tags (they would
         duplicate on every page). The JSON-LD below stays static: site-level
         entity data, valid on every page. -->
    <title>AlmaMesh — Free Local-First Vedic Astrology in Your Browser</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AlmaMesh",
        "url": "https://almamesh.com",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "description": "Free, local-first Vedic astrology that runs entirely in your browser. No accounts, no server, offline after first load. Honest, anti-scam, open engine (Skyfield/Pyodide), optional BYO-AI narration.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/hseshadr/almamesh",
        "author": {
          "@type": "Person",
          "name": "Harish Seshadri"
        }
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Observatory typography (Fraunces / Hanken Grotesk / Spline Sans Mono) is
         SELF-HOSTED via @fontsource-variable (imported in main.tsx). No external
         font CDN: AlmaMesh makes zero cross-origin requests and stays fully
         offline; Vite bundles+hashes the woff2 and the SW precaches them. -->
    <!-- Prevent caching of HTML shell -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body class="font-sans antialiased bg-background-primary">
    <noscript>
      <h1>AlmaMesh — free, local-first Vedic astrology that runs in your browser</h1>
      <p>
        AlmaMesh computes authentic Vedic (sidereal) astrology charts entirely on
        your device with transparent, open chart math (Skyfield / Pyodide). No
        accounts, no server, and offline after the first load — nothing about your
        birth data ever leaves your machine. Optional bring-your-own-AI narration
        keeps interpretation in your control.
      </p>
      <p>
        <a href="https://github.com/hseshadr/almamesh">View source on GitHub</a>
      </p>
      <p>
        <em>The interactive app requires JavaScript.</em>
      </p>
    </noscript>
    <div id="root"></div>
    <!-- Spec 064: dist/index.html carries the PRERENDERED LANDING markup, but
         it is also the SPA fallback for every private deep link (_redirects
         `/* /index.html 200` + the SW navigateFallback). Empty #root before
         first paint on non-public paths so /dashboard etc. show the usual
         boot spinner instead of a flash of the landing page. Runs inline +
         synchronously on purpose; no CSP restriction applies (_headers). -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        var publicPaths = ['/', '/welcome', '/privacy', '/terms', '/data-deletion'];
        if (publicPaths.indexOf(path) === -1) {
          var root = document.getElementById('root');
          if (root) root.innerHTML = '';
        }
      })();
    </script>
    <!--
      The PWA Service Worker (vite-plugin-pwa / Workbox) is registered from
      main.tsx with a prompt-driven update flow. Do NOT unregister it here:
      the SW caches the offline app shell + immutable engine data.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
