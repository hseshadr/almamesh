# AlmaMesh frontend — `bun install` configuration.
#
# SUPPLY-CHAIN COOLDOWN: refuse any package version published less than 24 hours
# ago. That window is when a compromised or hijacked release is live and still
# undetected; most get caught and unpublished inside it. This is the bun
# equivalent of the `minimumReleaseAge: 1440` that the pnpm-based frontends in
# this portfolio (aml-filter, edge-reco) enforce in their pnpm-workspace.yaml.
#
# THE UNIT IS SECONDS, NOT MINUTES. pnpm's `minimumReleaseAge` counts minutes;
# bun's counts seconds. 86400 seconds == 1440 minutes == 24h, so this is the
# same threshold as the pnpm consumers, expressed in bun's unit. Do NOT
# "simplify" this to 1440 to make the two files look alike — that would quietly
# cut the cooldown from 24 hours to 24 minutes.
#
# WHY THIS FILE EXISTS AT ALL. Bun's default is `null` (disabled), unlike pnpm
# v11 which applies a 1440-minute cooldown on its own. So until this file was
# added, almamesh had no release-age control of any kind — not by decision, just
# because it uses a different package manager. Demonstrated 2026-08-03:
# `@edgeproc/errors@0.1.0` published at 13:54Z was refused by aml-filter's pnpm
# gate and installed here 90 minutes later without a word.
#
# WHAT IT COVERS — measured on the pinned bun (see .bun-version), not assumed:
#   - Range spec, too-fresh candidate: resolution moves BACKWARD to the newest
#     version that clears the window, exit 0. With `baseline-browser-mapping@^2.10.38`,
#     gate off resolved 2.11.11 (23.6h old); gate on resolved 2.11.10.
#   - Exact spec, too-fresh version: hard failure, exit 1, nothing written:
#       error: No version matching "baseline-browser-mapping" found for
#       specifier "2.11.11" (blocked by minimum-release-age: 86400 seconds)
#
# WHAT IT DOES NOT COVER — stated so nobody mistakes its reach:
#   - It gates RESOLUTION only. Versions already pinned in bun.lock are not
#     re-checked, so adding this does not retroactively evict anything locked.
#   - A package already in bun's global install cache is served from cache and
#     skips the check. CI installs on a cold cache, which is where it counts.
#
# NEVER add `minimumReleaseAgeExcludes`. A fresh dependency failing here is the
# control WORKING — wait the window out, or pin the previous version. An
# exemption permanently disables the cooldown for that package everywhere,
# CI included, which is exactly the hole this closes. Enforced by
# apps/web/src/__tests__/supply-chain-cooldown.test.ts.
[install]
minimumReleaseAge = 86400
