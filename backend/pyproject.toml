[project]
name = "almamesh"
version = "0.1.0"
description = "Local-first Vedic astrology engine — offline, no account, no API key"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # Data
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Astronomy (Skyfield over public-domain JPL ephemerides; no AGPL swisseph)
    "skyfield>=1.49",
    # Utils
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "python-dotenv>=1.0.0",
    # YAML loading for the predictive rule packs (src/almamesh/rules/*.yaml).
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12.20250915",
    # Local-first substrate: signed content-addressed bundle delivery + the
    # Task/Runtime/Router core. Only [bundles] — no FAISS/vector extras needed.
    "edge-proc[bundles]>=0.1.0",
    # Bundle-publisher CLI (almamesh-bundle).
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Complexity gate (radon-based) — see [tool.poe.tasks.lint].
    "xenon>=0.9.3",
    # Task runner: `uv run poe gate` is THE backend gate (CI runs exactly it).
    "poethepoet>=0.30",
]

[project.scripts]
almamesh-chart = "almamesh.edge.cli:main"
almamesh-bundle = "almamesh.edge.publish_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Security floor for the transitive bundle-signing dependency. cryptography is
# pulled in by edge-proc[bundles] for ed25519 bundle signing — NOT by chart
# math — so lifting it does not affect engine byte-determinism. Bumps the lock
# 48.0.0 -> 48.0.1 (security patch); capped <49 to avoid the untested major.
[tool.uv]
constraint-dependencies = ["cryptography>=48.0.1,<49"]

# In-repo vendored sources for the unpublished edge-proc substrate and its
# shared-libs-python dependency — a single clone builds with no private
# siblings. Provenance + re-vendor policy: backend/vendor/*/VENDORED.md.
# TODO(publish): replace with PyPI versions once edge-proc is released.
[tool.uv.sources]
edge-proc = { path = "vendor/edge-proc", editable = true }
shared-libs-python = { path = "vendor/shared-libs-python", editable = true }

# The backend quality gate (ENGINEERING-STANDARDS §3): `uv run poe gate`.
# CI's backend job runs exactly this command — gate and CI mirror both ways.
# xenon thresholds are grandfathered at C/C/A (2026-07-11): pre-existing B/C
# blocks are listed in CLAUDE.md ("xenon grandfather" punch list) and must be
# ratcheted to A/A/A; new code must be A. Coverage floor lives in pytest
# addopts below so every `pytest` run (local or CI) enforces it identically.
[tool.poe.tasks]
lint = { shell = "ruff check . && ruff format --check . && mypy src/ && xenon --max-absolute C --max-modules C --max-average A src/" }
test = "pytest -q"
# The vendored edge-proc substrate ships its own pinned suite (private .venv
# under vendor/edge-proc) — run it so a re-vendor or local patch can never
# silently break the bundle/signing substrate (see vendor/edge-proc/VENDORED.md).
test-vendored = { shell = "cd vendor/edge-proc && uv run --all-extras pytest -q" }
gate = ["lint", "test", "test-vendored"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# Coverage floor (ENGINEERING-STANDARDS §2). In addopts so the floor holds for
# EVERY pytest invocation — a bare `uv run pytest` can't silently skip it.
addopts = "--cov=almamesh --cov-report=term-missing:skip-covered --cov-fail-under=90"
markers = [
    "integration: marks tests as integration tests (require external services)",
]
filterwarnings = [
    # Ignore numpy deprecation warning from pydantic (external library issue)
    "ignore:In future, it will be an error for 'np.bool' scalars:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored upstream packages keep their upstream style/config — never
# reformat or lint them with this project's rules (see vendor/*/VENDORED.md).
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "astropy>=7.2.0",
]
