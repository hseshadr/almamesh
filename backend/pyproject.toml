[project]
name = "almamesh"
version = "0.1.0"
description = "Local-first Vedic astrology engine — offline, no account, no API key"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # Data
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    # Astronomy (Skyfield over public-domain JPL ephemerides; no AGPL swisseph)
    "skyfield>=1.54",
    # Utils
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
    "pytz>=2026.3.post1",
    "python-dotenv>=1.0.0",
    # YAML loading for the predictive rule packs (src/almamesh/rules/*.yaml).
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12.20260724",
    # Local-first substrate: signed content-addressed bundle delivery + the
    # Task/Runtime/Router core. Only [bundles] — no FAISS/vector extras needed.
    # FLOOR IS SECURITY-LOAD-BEARING, do not lower: 0.3.0 is the first release
    # whose promote-time anti-replay guard fails CLOSED. Before it, a promote at
    # an EQUAL version was accepted (`Version(x) < Version(x)` is `False`, and
    # that single `False` was read as proof of freshness), so replaying a
    # genuinely-signed pointer moved a device's content backwards under an
    # unchanged version label — no forgery needed. 0.2.0 closed the same hole for
    # unparseable versions and missing sequences. Proven by
    # tests/test_bundle_rollback_guard.py, which fails on any older edge-proc.
    "edge-proc[bundles]>=0.3.0",
    # Bundle-publisher CLI (almamesh-bundle).
    "typer>=0.27.0",
]

# NOTE: `avow` is deliberately NOT a runtime dependency. The engine computes
# strength summaries; the browser Worker SIGNS them in TypeScript
# (`@edgeproc/avow`), because PyNaCl's compiled `_sodium` extension does not
# register under this app's Pyodide boot. Keeping the engine crypto-free is what
# lets the browser drop `pynacl` (and its cffi/pycparser chain) from every boot.
# `avow` survives below as a TEST-ONLY conformance oracle: it mints the golden
# vectors in `testdata/vectors/` that the TypeScript signer must reproduce
# byte-for-byte. See tests/test_engine_is_crypto_free.py.

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    # Complexity gate (radon-based) — see [tool.poe.tasks.lint].
    "xenon>=0.9.3",
    # Task runner: `uv run poe gate` is THE backend gate (CI runs exactly it).
    "poethepoet>=0.30",
    # Cross-language conformance ORACLE only (see the note above `[project]`
    # dependencies): the Python Avow kernel that produced testdata/vectors/.
    # Never imported by `src/almamesh` — tests/test_engine_is_crypto_free.py
    # fails the build if it ever is.
    "avow>=0.1.1,<0.2",
]

[project.scripts]
almamesh-chart = "almamesh.edge.cli:main"
almamesh-bundle = "almamesh.edge.publish_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Security floors for transitive dependencies (ENGINEERING-STANDARDS §4). Neither
# is on the shipped PWA runtime, so neither affects engine byte-determinism.
# - cryptography: pulled in by edge-proc[bundles] for ed25519 bundle signing —
#   NOT by chart math. Bumps the lock 48.0.0 -> 48.0.1 (security patch); capped
#   <49 to avoid the untested major.
# - click: CLI-only, pulled in via typer for the almamesh-bundle CLI. Bumps
#   8.3.1 -> 8.3.3 to clear PYSEC-2026-2132; capped <8.4 (untested major).
[tool.uv]
constraint-dependencies = ["cryptography>=48.0.1,<49", "click>=8.3.3,<8.4"]

# NOTE: there is deliberately no `[tool.uv.sources]` here. edge-proc used to be
# vendored under backend/vendor/ because it was unpublished; it now resolves from
# PyPI like every other dependency, which is what keeps `pip-audit` and Dependabot
# able to see it (a path/git source makes them skip the package entirely) and what
# stops a snapshot silently drifting behind upstream security releases. The old
# vendored snapshot sat at 0.1.4 for two upstream security releases.

# The backend quality gate (ENGINEERING-STANDARDS §3): `uv run poe gate`.
# CI's backend job runs exactly this command — gate and CI mirror both ways.
# xenon thresholds are grandfathered at C/C/A (2026-07-11): pre-existing B/C
# blocks are listed in CLAUDE.md ("xenon grandfather" punch list) and must be
# ratcheted to A/A/A; new code must be A. Coverage floor lives in pytest
# addopts below so every `pytest` run (local or CI) enforces it identically.
[tool.poe.tasks]
lint = { shell = "ruff check . && ruff format --check . && mypy src/ && xenon --max-absolute C --max-modules C --max-average A src/" }
typecheck = "mypy src/"
complexity = "xenon --max-absolute C --max-modules C --max-average A src/"
test = "pytest -q"
gate = ["lint", "test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# Coverage floor (ENGINEERING-STANDARDS §2). In addopts so the floor holds for
# EVERY pytest invocation — a bare `uv run pytest` can't silently skip it.
addopts = "--cov=almamesh --cov-report=term-missing:skip-covered --cov-fail-under=90"
markers = [
    "integration: marks tests as integration tests (require external services)",
]
filterwarnings = [
    # Ignore numpy deprecation warning from pydantic (external library issue)
    "ignore:In future, it will be an error for 'np.bool' scalars:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "astropy>=8.0.1",
]
