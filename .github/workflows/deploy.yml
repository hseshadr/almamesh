# Privileged production ingress. Dagger owns key restoration, signing, shredding,
# pinned Wrangler deployment, Cloudflare source verification, live app/bundle
# identity verification, and the non-fatal IndexNow notification.
name: Deploy almamesh.com

on:
  workflow_run:
    workflows: ["Dagger"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-almamesh-com
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages (Dagger)
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_PRIVATE_KEY_B64: ${{ secrets.BUNDLE_PRIVATE_KEY_B64 }}
          BUNDLE_PUBLIC_KEY_B64: ${{ secrets.BUNDLE_PUBLIC_KEY_B64 }}
        with:
          version: "0.21.8"
          verb: call
          args: >-
            deploy
            --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN
            --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID
            --bundle-private-key-b64=env:BUNDLE_PRIVATE_KEY_B64
            --bundle-public-key-b64=env:BUNDLE_PUBLIC_KEY_B64
            --expected-sha=${{ github.event.workflow_run.head_sha }}
            sync
