# Weekly dependency-CVE audit (ENGINEERING-STANDARDS §4, Published tier).
# A red run of this workflow is a red repo — scheduled workflows count as CI;
# they don't block merges and rot silently, so check them explicitly:
#   gh run list --workflow=security-audit.yml
#
# SCOPE: both locked dependency graphs. Python is exported from uv.lock for
# pip-audit; Bun audits the exact frozen workspace lock. A red scheduled run is
# a red repository even though schedules do not participate in branch rules.
name: Security Audit

on:
  schedule:
    # 06:23 UTC every Monday — off-peak, offset from the hour.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend, locked deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-uv publishes no floating major tag — full pin required (§4).
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      # The §4 standard invocation: export the frozen lock to requirements and
      # audit that (pip-audit's default venv mode is fragile).
      #
      # Nothing is excluded. This step used to pass `--no-emit-package edge-proc
      # --no-emit-package shared-libs-python`, because both were vendored local
      # path sources with "no registry release to audit" — which made the audit
      # structurally blind to the substrate that verifies every signed bundle, and
      # kept it silent while the vendored snapshot sat two security releases behind
      # upstream. Both now resolve from PyPI and are audited like any other
      # dependency. Do not re-add an exclusion here.
      - name: Export locked dependencies
        run: >-
          uv export --frozen --all-extras --no-emit-project --no-hashes
          -o requirements.txt

      - name: Audit against known CVEs
        run: uvx pip-audit -r requirements.txt --disable-pip --no-deps

  bun-audit:
    name: bun audit (frontend, locked deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/.bun-version

      - name: Install the exact lock
        run: bun install --frozen-lockfile

      - name: Audit against known advisories
        run: bun audit
