name: Test

on:
  push:
    branches: [main, p2-browser-engine]
  pull_request:
    branches: [main]
  # Manual trigger: lets you re-run the full suite without a commit — e.g. to
  # recover a green run after a transient flake, or after a repo recreate (the
  # gitleaks push-diff scan has no valid base commit on the very first push).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs from a SINGLE checkout of this repo. The formerly-private
# dependencies are vendored in-tree (backend/vendor/{edge-proc,shared-libs-python}
# and frontend/packages/edgeproc-browser — see each VENDORED.md), so CI needs no
# extra tokens, no sibling checkouts, and no path patching.

jobs:
  # Secret scan: fail the build if any credential/key is committed (e.g. a
  # leftover SaaS .env, an API key, a private signing key). gitleaks scans the
  # working tree AND full git history, so `fetch-depth: 0` is required.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the GitHub API on pull_request
    # events; the default GITHUB_TOKEN needs pull-requests:read for that call
    # (else 403 "Resource not accessible by integration" before the scan runs).
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Key-custody tree-guard (ENGINEERING-STANDARDS §7): the bundle-signing
      # key directories (backend/keys*/ = private keys, backend/origin*/ =
      # signed origin trees) must NEVER be tracked. .gitignore covers them, but
      # a `git add -f` would slip past it — this step fails the build if any
      # path under them ever lands in the index. Production key custody:
      # password manager + repo secrets (see .github/workflows/deploy.yml
      # header and docs/deploy/almamesh-com.md).
      - name: Tree-guard — signing-key paths must not be tracked
        run: |
          tracked=$(git ls-files 'backend/keys*' 'backend/origin*')
          if [ -n "$tracked" ]; then
            echo "::error::Signing-key/origin paths are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no backend/keys*/ or backend/origin*/ paths tracked."

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # setup-uv publishes no floating major tag — full pin required
      # (ENGINEERING-STANDARDS §4; v8.3.2 verified 2026-07-11).
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/vendor/edge-proc/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # edge-proc + shared-libs-python are vendored in-repo (backend/vendor/)
      # as local path sources, recorded as such in the checked-in uv.lock —
      # `--locked` asserts the lock still matches pyproject and installs
      # exactly what's committed.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # THE backend gate — the same single command a developer runs locally
      # (`make gate` fans out to it). Composition lives in ONE place,
      # backend/pyproject.toml [tool.poe.tasks]: ruff lint → ruff format
      # --check → mypy strict → xenon (grandfathered C/C/A, see CLAUDE.md) →
      # pytest with the coverage floor (addopts) → the vendored edge-proc
      # suite (its own pinned .venv; see backend/vendor/edge-proc/VENDORED.md).
      # Running the gate command itself (not a re-listing of its steps) is what
      # keeps CI and the local gate mirrored both directions
      # (ENGINEERING-STANDARDS §3/§4).
      - name: Run the backend gate (lint, types, complexity, tests+coverage, vendored suite)
        run: uv run poe gate

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The whole frontend — including @edgeproc/browser, the edge-proc browser
      # sync tier vendored at packages/edgeproc-browser — is a single bun
      # workspace installed from this checkout. Bun is the sanctioned toolchain
      # exception (ENGINEERING-STANDARDS §2), pinned in frontend/.bun-version.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/.bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock', 'frontend/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The maximal report-PDF unit gate renders real bytes, then uses Poppler
      # bbox output to enforce A4 content bounds and pagination sentinels.
      - name: Install Poppler PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # THE frontend gate — the same single command a developer runs locally
      # (`make gate` fans out to it). Composition lives in ONE place,
      # frontend/package.json "gate": declarations build (composite project
      # refs need dist present or dependents fail TS6305) → workspace-wide
      # typecheck → lint → unit tests (offline-deterministic via
      # EDGE_RECO_SKIP_EMBEDDING_PARITY inside the script) → production build.
      # Playwright e2e is deliberately NOT here — it needs the generated 38 MB
      # engine assets and runs as the exit-gate / e2e-smoke / nightly lanes
      # (see CLAUDE.md "Playwright e2e tiering").
      - name: Run the frontend gate (declarations, typecheck, lint, unit tests, build)
        run: bun run gate

  # Live-browser exit gate: the heavyweight e2e job that PROVES the in-browser
  # engine works end-to-end with no backend and no login. It generates the large
  # git-ignored runtime assets (Pyodide dist + signed edge-proc bundle), serves a
  # real production build via `vite preview`, then drives headless Chromium
  # (Playwright) through scripts/verify-exit-gate.mjs — which exits non-zero on
  # any failed check. This is intentionally heavier than the unit jobs (it needs
  # BOTH toolchains: bun for the build, uv/Python for the bundle publisher) and
  # downloads a browser + the Pyodide dist, so expect a longer runtime.
  exit-gate:
    name: In-Browser Engine Exit Gate (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Both dependency layers the gate needs live IN this checkout:
      #  - edge-proc + shared-libs-python (Python): vendored under
      #    backend/vendor/ — setup-dev-assets.sh's `uv build --wheel` +
      #    `almamesh-bundle` resolve them as local path sources.
      #  - @edgeproc/browser (TS): vendored at frontend/packages/edgeproc-browser,
      #    a regular bun workspace member.

      # ---- Python toolchain (for the bundle publisher) ----
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # setup-uv publishes no floating major tag — full pin required (§4).
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/vendor/edge-proc/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # ---- JS toolchain ----
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/.bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock', 'frontend/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache the Skyfield ephemeris data (de421.bsp ~16MB + finals2000A.all ~3.5MB).
      # NASA's JPL FTP server (ssd.jpl.nasa.gov) is unreliable from GH Actions runners
      # and causes intermittent ETIMEDOUT failures. The files are static (de421 is a
      # 1997 ephemeris; finals are only re-fetched when stale), so a cache keyed on
      # a fixed version string eliminates the flaky external download after the first
      # successful run. setup-dev-assets.sh's Skyfield Loader is a no-op when the
      # files already exist at ~/.skyfield-data.
      - name: Cache Skyfield ephemeris data (de421.bsp + finals2000A.all)
        uses: actions/cache@v6
        with:
          path: ~/.skyfield-data
          key: skyfield-data-de421-v1

      # Generate the large git-ignored runtime assets: fetch the pinned Pyodide
      # dist from jsdelivr, then `uv build --wheel` + `almamesh-bundle keygen`/
      # `bundle --offline` (Python) into apps/web/public/{pyodide,bundle,public.key}.
      # uv resolves the backend's vendored path sources straight from this
      # checkout. Both the CDN fetch and uv run fine on ubuntu-latest.
      - name: Generate dev assets (Pyodide dist + signed bundle)
        run: bash apps/web/scripts/setup-dev-assets.sh

      # Install only the Chromium browser + its OS deps for Playwright.
      - name: Install Playwright Chromium
        working-directory: frontend/apps/web
        run: bunx playwright install --with-deps chromium

      # Build a REAL production build with the exit-gate observability hooks
      # opted in (window.__ALMAMESH_STAGE__ / __almameshGenerate). The dev server
      # cannot be used — its ESM module workers fail to resolve `pyodide` in
      # worker scope (see verify-exit-gate.mjs header).
      - name: Build verification bundle (exit-gate hooks)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
          VITE_EXIT_GATE_HOOKS: "1"
        run: ./node_modules/.bin/vite build --outDir dist-verify

      # Fast, browser-free precache-layout gate: serve the built bundle through a
      # server that mimics Cloudflare Pages' .html->extensionless 308 clean-URL
      # redirects and assert EVERY Workbox precache URL resolves 200 with no
      # redirect. This reproduces the prod-only failure the plain `vite preview`
      # gates miss (preview serves .html as 200), where a redirecting precache key
      # left returning users with an empty app-shell precache + a Chrome error page.
      - name: Verify precache is robust to Cloudflare clean-URL redirects
        working-directory: frontend/apps/web
        run: node scripts/verify-precache-redirect.mjs dist-verify

      # Serve the built bundle and run the headless-Chromium gate. The preview
      # server is started in the background on a fixed strict port; we poll until
      # it responds before driving the gate. verify-exit-gate.mjs exits non-zero
      # on any failed check, failing the job.
      - name: Run exit-gate verification (headless Chromium)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite preview --outDir dist-verify --port 4199 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          # Wait (up to ~60s) for the preview server to accept connections.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://localhost:4199"; then
              echo "preview server is up (attempt $i)"
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "preview server exited prematurely" >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS -o /dev/null "http://localhost:4199" || {
            echo "preview server never became ready" >&2
            exit 1
          }

          node scripts/verify-exit-gate.mjs http://localhost:4199

          # i18n live-drive gate: reuse the SAME already-running preview (4199)
          # — no second build/preview. Asserts the onboarding screen renders
          # translated in en/es/pt with the right <html lang> and a clean
          # console. Runs from apps/web so it resolves @playwright/test from the
          # app's node_modules; exits non-zero on any failed check (set -e fails
          # the job). The preview is torn down by the trap above on step exit.
          node scripts/verify-i18n.mjs http://localhost:4199

      # Stubbed Playwright "human tests": boot the SAME real in-browser engine
      # (Pyodide dist + signed bundle already generated above) but stub the
      # OpenAI-compatible LLM via page.route — so they need NO API key and are
      # deterministic + CI-safe. Each config self-builds a production bundle with
      # VITE_EXIT_GATE_HOOKS=1 and serves it via `vite preview` on its own strict
      # port (4191/4192, distinct from the exit gate's 4199). These lock in:
      #   - interpretation.spec.ts: the 5-section structured reading renders (and
      #     a failing endpoint shows a loud error + Retry, never a blank card).
      #   - chat.grounding.spec.ts: the outbound chat request uses the fast chat
      #     model (minimax/minimax-m2.7) AND its prompt reuses the generated
      #     reading ("Your chart reading …" block) — the two chat behaviours that
      #     otherwise have unit coverage only.
      - name: Run stubbed Playwright human tests (interpretation + chat grounding)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
        run: |
          bun run test:e2e:interp
          bun run test:e2e:chat:grounding
          bun run test:e2e:rectification

      # Phase-2 rectification wizard e2e: drives the REAL /rectify/:profileId
      # wizard (cusp + unknown-time window cases) with a synthetic Bengaluru cusp
      # native — zero owner PII. No LLM stub needed (rectification is pure engine).
      # The config self-builds with VITE_EXIT_GATE_HOOKS=1 on its own strict port
      # (4195, distinct from all other preview ports). Pyodide dist + signed bundle
      # are already present from the Generate dev assets step above.
      - name: Run Phase-2 wizard e2e (cusp + unknown-time)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
        run: bun run test:e2e:wizard

      # REAL first-run onboarding gate — the ONE gate the hooked builds above
      # can NOT be. Everything before this builds with VITE_EXIT_GATE_HOOKS=1 and
      # SEEDS the chart via window.__almameshGenerate, bypassing the actual
      # onboarding → engine-bootstrap → Generate → dashboard path (the 2026-06-19
      # scar: a green hooked gate while real first-run was permanently stuck).
      # This builds WITHOUT hooks and drives the actual UI a new visitor touches
      # — name, the MUI X v8 date/time section spinbuttons, the offline city
      # search, the real ~38 MB engine bootstrap + on-device compute — then
      # asserts a chart renders on /dashboard with a clean console. Reuses the
      # Pyodide dist + signed bundle generated above; its own no-hooks build +
      # preview on a distinct strict port (4200), torn down by the trap on exit.
      - name: Run REAL onboarding journey + recovery e2e (no hooks)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite build --outDir dist-real
          ./node_modules/.bin/vite preview --outDir dist-real --port 4200 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          # Wait (up to ~60s) for the preview server to serve the onboarding route.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://localhost:4200/onboarding"; then
              echo "preview server is up (attempt $i)"
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "preview server exited prematurely" >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS -o /dev/null "http://localhost:4200/onboarding" || {
            echo "preview server never became ready" >&2
            exit 1
          }

          # Happy path: the real first-run journey renders a chart.
          node scripts/verify-real-onboarding.mjs http://localhost:4200
          # Unhappy path: a blocked engine bundle surfaces the in-app recovery
          # card (Retry / Reset & reload) instead of a silent permanent hang, and
          # Retry recovers to a rendered chart once the bundle is reachable again
          # (the 2026-06-19 "returning visitor stuck on Connection Issue" scar).
          node scripts/verify-onboarding-recovery.mjs http://localhost:4200

  # PR smoke lane for the Playwright flow specs (ENGINEERING-STANDARDS §4:
  # heavyweight browser suites split into a PR smoke lane + a nightly full
  # lane — this is the smoke half; nightly-e2e.yml runs all 11 specs).
  # The two fastest KEYLESS specs not already covered by the exit-gate job:
  #   - ai-settings.spec.ts   — the AI-setup wizard flow; settings UI +
  #     localStorage only, no engine boot, so it is the cheapest spec we have.
  #   - report-pdf.e2e.spec.ts — the hardest real gate: ACTUAL onboarding →
  #     engine bootstrap → Generate → dashboard → rectify → PDF download, built
  #     WITHOUT hooks (no __almameshGenerate seeding) and needing no LLM key.
  # Each playwright config self-builds its production bundle and serves it via
  # `vite preview` on its own strict port (4188 / 4196). Tiering doc: CLAUDE.md
  # "Playwright e2e tiering".
  e2e-smoke:
    name: E2E Smoke (ai-settings + real report-PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ---- Python toolchain (for the bundle publisher) ----
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # setup-uv publishes no floating major tag — full pin required (§4).
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock', 'backend/vendor/edge-proc/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # ---- JS toolchain ----
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/.bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock', 'frontend/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same flake engineering as the exit-gate job: NASA's JPL server is
      # unreliable from runners; the files are static, so a fixed-key cache
      # kills the flaky download after the first green run.
      - name: Cache Skyfield ephemeris data (de421.bsp + finals2000A.all)
        uses: actions/cache@v6
        with:
          path: ~/.skyfield-data
          key: skyfield-data-de421-v1

      # report-pdf drives the REAL engine — it needs the Pyodide dist + signed
      # bundle in apps/web/public (ai-settings does not, but one generation
      # serves both).
      - name: Generate dev assets (Pyodide dist + signed bundle)
        run: bash apps/web/scripts/setup-dev-assets.sh

      - name: Install Playwright Chromium
        working-directory: frontend/apps/web
        run: bunx playwright install --with-deps chromium

      # report-pdf.e2e.spec.ts extracts the downloaded PDF's text with the
      # system `pdftotext` (poppler-utils).
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Smoke — AI-setup wizard flow (no engine)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
        run: bun run test:e2e:ai

      - name: Smoke — REAL chart generation → report PDF (no hooks, no LLM key)
        working-directory: frontend/apps/web
        env:
          VITE_API_URL: ""
        run: bun run test:e2e:report:pdf
