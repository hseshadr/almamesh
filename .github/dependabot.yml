# Weekly grouped dependency PRs (ENGINEERING-STANDARDS §4, Published tier).
# The one remaining vendored tree (frontend/packages/edgeproc-browser) is
# deliberately NOT covered — it re-vendors from its source repo on its own
# policy (see its VENDORED.md), never via dependency PRs here. `edge-proc` is
# no longer vendored: it resolves from PyPI and rides the `uv` group below, so
# an upstream security release reaches this repo as a PR instead of waiting for
# somebody to notice a stale snapshot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Python engine + bundle publisher (uv.lock).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # Bun workspace (bun.lock) — dependabot's bun ecosystem.
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
